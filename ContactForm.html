<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="ContactForm.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Caveat:wght@400..700&family=Iosevka+Charon:ital,wght@0,300;0,400;0,500;0,700;1,300;1,400;1,500;1,700&family=Libre+Baskerville:ital,wght@0,400..700;1,400..700&family=Open+Sans:ital,wght@0,300..800;1,300..800&display=swap"
        rel="stylesheet">
    <title>Login-Page</title>
</head>

<body>
    <div class="container">
        <h1 class="text">login-Form</h1>
        <form action="" id="Form">
            <label for="email">
                <input type="email" name="email" placeholder="Enter Email here" spellcheck="true">
            </label>
            <label for="password">
                <input type="password" name="password" placeholder="Enter Password" spellcheck="true">
            </label>
            <button type="submit" class="button">Log-in</button>
        </form>
    </div>
</body>

</html>
